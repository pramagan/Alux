<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Alux</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Alux</h1>
      <span id="status" class="status">checking…</span>
    </header>

    <section id="connect-view" hidden>
      <p>Connect your OpenRouter account to start chatting. Your API key is generated by OpenRouter for you and never leaves this device.</p>
      <button id="connect-btn">Connect OpenRouter account</button>
      <p id="connect-error" class="error" hidden></p>
    </section>

    <section id="chat-view" hidden>
      <div id="messages" class="messages"></div>
      <form id="chat-form">
        <textarea id="chat-input" rows="2" placeholder="Ask jev-latest…"></textarea>
        <button id="send-btn" type="submit">Send</button>
      </form>
      <button id="disconnect-btn" class="link-btn" type="button">Disconnect</button>
    </section>

    <script src="popup.js" type="module"></script>
  </body>
</html>
